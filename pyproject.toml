[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "boolmf"
dynamic = ["version"]
description = "Bayesian nonparametric Boolean matrix factorization with a scikit-learn-compatible API."
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "The boolmf developers" }]
keywords = [
    "boolean matrix factorization",
    "noisy-or",
    "indian buffet process",
    "bayesian nonparametrics",
    "mcmc",
    "latent feature model",
    "scikit-learn",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.6",
    "numba>=0.59",
    "joblib>=1.3",
]

[project.optional-dependencies]
pandas = ["pandas>=2.0"]
test = ["pytest>=7", "pandas>=2.0"]
docs = ["sphinx>=7", "numpydoc>=1.6", "sphinx-gallery>=0.15", "pydata-sphinx-theme>=0.15", "matplotlib>=3.7"]
dev = ["boolmf[test,docs]", "ruff>=0.5"]

[project.urls]
Homepage = "https://github.com/siddC/boolmf"
Repository = "https://github.com/siddC/boolmf"
Issues = "https://github.com/siddC/boolmf/issues"

[tool.hatch.version]
path = "boolmf/__init__.py"

[tool.hatch.build.targets.sdist]
include = ["boolmf", "tests", "README.md", "LICENSE", "CHANGELOG.md", "pyproject.toml"]

[tool.hatch.build.targets.wheel]
packages = ["boolmf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: recovery tests on larger simulations (deselect with -m 'not slow')"]
filterwarnings = [
    "ignore::numba.core.errors.NumbaPerformanceWarning",
    # the API tests use very short chains on purpose
    "ignore:chains disagree on:UserWarning",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]
ignore = ["E741", "B905"]
