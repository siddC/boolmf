name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"   # weekly, catches breakage from new dependency releases
  workflow_dispatch:

concurrency:                # a new push to a pull request cancels its older runs
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # Pinned so a new ruff release cannot fail unrelated pull requests; bump it on purpose.
      - run: pip install "ruff==0.15.11"
      - run: ruff check --output-format=github .

  test:
    name: test (${{ matrix.os }}, ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-latest, windows-latest and Python 3.15 are added before release.
        os: [ubuntu-latest]
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[test]"
      - run: pytest -q -m "not slow"

  # The one check to require in the branch ruleset. It passes only if every job above
  # succeeded, so the ruleset does not change when the matrix does. `if: always()` makes
  # it run (and fail) when a job it depends on fails or is cancelled; without it the job
  # would be skipped, and GitHub treats a skipped required check as passing.
  ci-passed:
    if: always()
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - name: Check that every job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" != "success" ]; then exit 1; fi
          done
